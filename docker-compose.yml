services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: fitness_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once, only against an empty data directory: 01 creates the
      # `documents` schema (never checked into source control before this),
      # 02 seeds it with the same ~277 chunks ingest.py produces from
      # data/hku_academic.txt + data/exercises.txt -- generated once here
      # rather than run via ingest.py itself, since ingest.py has no dedup
      # guard and would duplicate rows on every container restart.
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/chroma/chroma

  backend:
    build: ./fitness-rag-backend
    restart: unless-stopped
    env_file:
      - ./fitness-rag-backend/.env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Overrides whatever DB host/Chroma settings are in .env (which target
      # the host machine's local Postgres) so the containerized backend
      # talks to the other containers in this compose stack instead.
      DB_HOST: postgres
      DB_PORT: "5432"
      CHROMA_HOST: chroma
      CHROMA_PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  chroma_data:
